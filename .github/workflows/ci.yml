# Surekli entegrasyon: main'e giden her degisiklikte web tarafinda tip
# kontrolu, lint ve birim testleri; mobil tarafta tip kontrolu, Expo
# tanilamasi ve paket derlemesi calisir.
#
# NEDEN VAR: main'e push, Vercel'de production deploy tetikliyor. Bu dosyadan
# once o yolun onunde otomatik hicbir kapi yoktu; her dogrulama elle
# yapiliyordu. Burasi o boslugu kapatiyor.
#
# E2E BILEREK YOK. Playwright kosusu ~5,5 dakika suruyor, gercek Clerk test
# kullanicilari ve ayri bir Neon veritabani istiyor. Bunlari CI'a tasimak,
# uretim disi sirlari yeni bir ortama kopyalamak demek - kazanci degil.
# E2E yerelde calismaya devam ediyor: npm run test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Panelden elle de calistirilabilsin (bir seyi denemek istedigimizde).
  workflow_dispatch:

# En az yetki: is akisinin depoyu okumaktan baska bir sey yapmasina gerek yok.
permissions:
  contents: read

# Ayni dal icin arka arkaya push atilirsa, eskiyen kosuyu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web ve mobil dogrulama
    runs-on: ubuntu-latest

    env:
      # prisma.config.ts, DATABASE_URL tanimli degilse HATA firlatiyor
      # (bkz. prisma-url.ts). Ama "prisma generate" veritabanina BAGLANMIYOR,
      # yalnizca semayi okuyor - bu yuzden sahte bir deger yetiyor ve CI'a
      # gercek bir baglanti dizesi koymamiz gerekmiyor.
      #
      # Bu deger bilerek acikca sahte. Hicbir sunucuya baglanilmiyor.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_not_a_real_database

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          # Yerel gelistirme surumuyle ayni tutuluyor (v24). CI ile yerelin
          # farkli Node surumlerinde olmasi, "bende calisiyordu" hatalarinin
          # klasik kaynagi.
          node-version: 24
          cache: npm
          # IKI lock dosyasi da onbellek anahtarina giriyor. Yalnizca koktekini
          # yazsaydik mobil bagimliliklari her kosuda sifirdan indirilirdi
          # (808 paket) ve mobil lock degistiginde onbellek yenilenmezdi.
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Bagimliliklari kur
        # "npm ci" package-lock.json'i birebir uygular ve lock dosyasi
        # package.json ile uyusmuyorsa bilerek patlar - "npm install"in
        # aksine lock'u sessizce guncellemez.
        run: npm ci

      - name: Prisma Client uret
        # ZORUNLU ADIM. Prisma 7'de @prisma/client'in postinstall betigi yok,
        # yani "npm ci" tek basina client'i URETMIYOR. Uretilmezse
        # "tsc --noEmit" @prisma/client tiplerini bulamaz ve butun proje
        # derlenmez. Yerelde bu adim gorunmuyor cunku client bir kez uretilip
        # node_modules icinde duruyor.
        run: npx prisma generate

      - name: Tip kontrolu
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Birim testleri
        # Vitest yalnizca src/**/*.test.ts topluyor; e2e/ klasoru Playwright'a
        # ait ve buraya dahil degil. Testlerin tamami Prisma'yi mock'ladigi
        # icin gercek bir veritabani gerekmiyor - dogrulandi.
        run: npm test

      # ---- Mobil ----
      #
      # NEDEN AYRI BIR JOB DEGIL: mobil tip kontrolu KOKUN uretilmis Prisma
      # client'ina bagli. mobile/tsconfig.json "@/*" takma adini "../src/*"a
      # esliyor ve src/lib/expense-labels.ts ile expense-category-guess.ts
      # "@prisma/client"tan tip aliyor; mobile/node_modules'ta @prisma yok,
      # yani cozum koke cikiyor. Ayri bir job kok kurulumunu ve
      # "prisma generate"i bastan yapmak zorunda kalirdi.
      #
      # NEDEN KOSULLU DEGIL ("yalnizca mobile/ degistiyse"): src/lib'deki bir
      # degisiklik mobili kirabiliyor - paylasilan saf moduller iki agacta da
      # derleniyor. Kapatmaya calistigimiz boslugun adi zaten "bazen
      # bakilmiyor"; kosullu kosmak onu geri getirirdi.

      - name: Mobil bagimliliklari kur
        run: npm ci
        working-directory: mobile

      - name: Mobil tip kontrolu
        # mobile/ kok tsconfig'in exclude'unda, yani "npx tsc --noEmit" kokte
        # mobil dosyalara HIC bakmiyor. Bu adim eklenene kadar mobil kodun
        # tipleri CI'da hicbir zaman kontrol edilmedi.
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Expo tanilamasi
        # Bagimliliklarin SDK ile uyumunu ve eksik native es bagimliliklari
        # kontrol ediyor. Ilk kosuldugunda gercek bir sey buldu: ClerkProvider
        # expo-web-browser'i kosulsuz require ediyor ama paket yalnizca DOLAYLI
        # kuruluydu. Expo Go'da sorun cikmiyor, native derlemede native modul
        # baglanmayabiliyor - yani tam da TestFlight'ta.
        run: npx expo-doctor
        working-directory: mobile

      - name: Mobil paket derleniyor mu
        # tsc'nin GOREMEDIGI katman: Metro'nun depo kokunu izleyip "@/lib"
        # takma adini gercekten cozebilmesi, varliklarin bulunmasi, paketin
        # kurulabilmesi. Faz 18'de alti gercek hatanin hicbirini tsc
        # gostermedi; bu adim onlarin bir kismini gosterirdi. ~5 saniye.
        #
        # mobile/.env.local CI'DA YOK ve olmasi da gerekmiyor: EXPO_PUBLIC_*
        # degiskenleri pakete GOMULUYOR, tanimli degillerse undefined olarak
        # gomuluyorlar ve export yine basariyla bitiyor. Olculdu.
        #
        # --clear BILEREK: Metro'nun onbellegi env degisikligini gormuyor.
        # Ayni komut, .env.local varken ve yokken, BIREBIR AYNI paket hash'ini
        # uretti. Yayin derlemesinde bunun bedeli yanlis API adresi gomulmus
        # bir uygulamadir; burada da onbellegi kapatip her kosuyu sifirdan
        # derletmek dogrusu.
        run: npx expo export --platform ios --clear --output-dir /tmp/expo-export-ci
        working-directory: mobile
